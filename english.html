<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Course | Ghost Code Academy</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:
    radial-gradient(circle at 20% 10%,#18234a 0%,transparent 35%),
    radial-gradient(circle at 90% 90%,#261044 0%,transparent 35%),
    #070b16;
    color:#fff;
    min-height:100vh;
}

header{
    padding:25px 18px;
    text-align:center;
    background:rgba(10,15,30,.85);
    border-bottom:1px solid #26345d;
    position:sticky;
    top:0;
    z-index:10;
    backdrop-filter:blur(12px);
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#6ea8ff;
}

.subtitle{
    margin-top:7px;
    color:#aab4d0;
    font-size:13px;
}

.progressBox{
    max-width:700px;
    margin:18px auto 0;
    background:#11182c;
    border:1px solid #26345d;
    border-radius:15px;
    padding:15px;
}

.progressInfo{
    display:flex;
    justify-content:space-between;
    margin-bottom:9px;
    font-size:13px;
    color:#cbd4ed;
}

.progress{
    width:100%;
    height:10px;
    background:#252d43;
    border-radius:20px;
    overflow:hidden;
}

.progressBar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#4d8dff,#8d5cff);
    border-radius:20px;
    transition:.4s;
}

.container{
    width:min(1100px,94%);
    margin:30px auto;
}

.sectionTitle{
    text-align:center;
    margin-bottom:25px;
}

.sectionTitle h1{
    font-size:28px;
}

.sectionTitle p{
    color:#9da8c4;
    margin-top:8px;
    font-size:14px;
}

.lessons{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
}

.lesson{
    position:relative;
    background:linear-gradient(145deg,#111a31,#0c1223);
    border:1px solid #26345d;
    border-radius:20px;
    padding:20px;
    min-height:185px;
    transition:.25s;
    overflow:hidden;
}

.lesson:not(.locked){
    cursor:pointer;
}

.lesson:not(.locked):hover{
    transform:translateY(-5px);
    border-color:#578fff;
    box-shadow:0 10px 30px rgba(55,100,255,.18);
}

.lesson.locked{
    opacity:.55;
    cursor:not-allowed;
}

.lessonNumber{
    width:45px;
    height:45px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#172448;
    color:#72a6ff;
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}

.lesson h3{
    font-size:17px;
    margin-bottom:8px;
}

.lesson p{
    color:#9ba6c1;
    font-size:12px;
    line-height:1.8;
}

.status{
    position:absolute;
    left:15px;
    top:15px;
    font-size:20px;
}

.completed{
    border-color:#315d47;
}

.completed .lessonNumber{
    background:#17382a;
    color:#5ee59a;
}

.badge{
    display:inline-block;
    margin-top:12px;
    padding:5px 9px;
    border-radius:8px;
    background:#14233b;
    color:#91b5ff;
    font-size:10px;
}

.completed .badge{
    background:#17382a;
    color:#5ee59a;
}

footer{
    text-align:center;
    padding:35px 10px;
    color:#68728c;
    font-size:12px;
}
</style>
</head>

<body>

<header>
    <div class="logo">👻 Ghost Code Academy</div>
    <div class="subtitle">دوره جامع آموزش زبان انگلیسی</div>

    <div class="progressBox">
        <div class="progressInfo">
            <span id="progressText">پیشرفت: 0 از 50 درس</span>
            <span id="xpText">XP: 0</span>
        </div>

        <div class="progress">
            <div class="progressBar" id="progressBar"></div>
        </div>
    </div>
</header>

<div class="container">

    <div class="sectionTitle">
        <h1>🇬🇧 دوره انگلیسی</h1>
        <p>از صفر تا سطح متوسط — ۵۰ درس مرحله‌به‌مرحله</p>
    </div>

    <div class="lessons" id="lessons"></div>

</div>

<footer>
    Ghost Code Academy © 2026
</footer>

<script>

/* =========================================
   تنظیمات
========================================= */

const TOTAL_LESSONS = 50;


/* =========================================
   نام درس‌ها
========================================= */

const lessonTitles = [
    "سلام و معرفی",
    "خداحافظی و احوالپرسی",
    "ضمیرهای شخصی",
    "افعال to be",
    "جمله‌های ساده",
    "اعداد انگلیسی",
    "روزها و ماه‌ها",
    "رنگ‌ها",
    "اعضای خانواده",
    "اشیای روزمره",
    "افعال پرکاربرد",
    "زمان حال ساده",
    "منفی کردن جملات",
    "سوالی کردن جملات",
    "There is / There are",
    "اسم‌های قابل شمارش",
    "صفات",
    "مقایسه کردن",
    "حروف اضافه",
    "مکان‌ها",
    "زمان و ساعت",
    "کارهای روزانه",
    "غذا و نوشیدنی",
    "خرید کردن",
    "لباس‌ها",
    "آب‌وهوا",
    "حمل‌ونقل",
    "شهر و مکان‌ها",
    "پرسیدن مسیر",
    "مکالمه روزمره",
    "حال استمراری",
    "گذشته ساده",
    "افعال بی‌قاعده",
    "گذشته استمراری",
    "آینده با Will",
    "آینده با Going to",
    "افعال Modal",
    "Can / Could",
    "Should / Must",
    "Present Perfect",
    "قیدها",
    "جملات شرطی",
    "جملات موصولی",
    "افعال عبارتی",
    "مکالمه پیشرفته",
    "خواندن متن",
    "نوشتن متن",
    "درک شنیداری",
    "مرور جامع",
    "آزمون نهایی"
];


/* =========================================
   پیدا کردن XP
   ========================================= */

function getXP(){

    const possibleKeys = [
        "xp",
        "XP",
        "userXP",
        "totalXP",
        "englishXP"
    ];

    for(const key of possibleKeys){

        const value = localStorage.getItem(key);

        if(value !== null){

            const number = parseInt(value);

            if(!isNaN(number)){
                return number;
            }
        }
    }

    return 0;
}


/* =========================================
   تشخیص تکمیل شدن درس
========================================= */

function isLessonCompleted(number){

    const possibleKeys = [

        `lesson${number}Completed`,

        `lesson_${number}_completed`,

        `lesson${number}_completed`,

        `completedLesson${number}`,

        `completed_${number}`,

        `lesson-${number}-completed`

    ];

    for(const key of possibleKeys){

        const value = localStorage.getItem(key);

        if(
            value === "true" ||
            value === "1" ||
            value === "completed" ||
            value === "yes"
        ){
            return true;
        }
    }

    return false;
}


/* =========================================
   تعداد درس‌های تکمیل شده
========================================= */

function getCompletedCount(){

    let count = 0;

    for(let i=1;i<=TOTAL_LESSONS;i++){

        if(isLessonCompleted(i)){
            count++;
        }
    }

    return count;
}


/* =========================================
   آیا درس باز است؟
=========================================

   قانون:

   درس 1 همیشه باز

   درس N وقتی باز است که
   درس N-1 تکمیل شده باشد

   بنابراین درس‌های قبلی
   هیچ‌وقت دوباره قفل نمی‌شوند.
========================================= */

function isLessonUnlocked(number){

    if(number === 1){
        return true;
    }

    return isLessonCompleted(number - 1);
}


/* =========================================
   ساخت کارت‌ها
========================================= */

function createLessons(){

    const container = document.getElementById("lessons");

    container.innerHTML = "";

    for(let i=1;i<=TOTAL_LESSONS;i++){

        const completed = isLessonCompleted(i);

        const unlocked = isLessonUnlocked(i);

        const card = document.createElement("div");

        card.className =
            "lesson" +
            (completed ? " completed" : "") +
            (!unlocked ? " locked" : "");

        let status = "";

        if(completed){

            status = "✅";

        }else if(!unlocked){

            status = "🔒";

        }else{

            status = "🔓";
        }


        card.innerHTML = `

            <div class="status">${status}</div>

            <div class="lessonNumber">
                ${i}
            </div>

            <h3>
                درس ${i}: ${lessonTitles[i-1]}
            </h3>

            <p>
                آموزش مرحله‌ای زبان انگلیسی
                همراه با تمرین و سوالات تعاملی.
            </p>

            <span class="badge">
                ${
                    completed
                    ? "تکمیل شده"
                    : unlocked
                    ? "قابل شروع"
                    : "قفل"
                }
            </span>

        `;


        /* فقط درس‌های باز قابل کلیک هستند */

        if(unlocked){

            card.addEventListener("click",function(){

                window.location.href =
                    `lesson${i}.html`;

            });
        }


        container.appendChild(card);
    }
}


/* =========================================
   بروزرسانی پیشرفت
========================================= */

function updateProgress(){

    const completed = getCompletedCount();

    const xp = getXP();

    const percent =
        Math.round((completed / TOTAL_LESSONS) * 100);


    document.getElementById("progressText").textContent =
        `پیشرفت: ${completed} از ${TOTAL_LESSONS} درس`;

    document.getElementById("xpText").textContent =
        `XP: ${xp}`;


    document.getElementById("progressBar").style.width =
        `${percent}%`;
}


/* =========================================
   اجرای اولیه
========================================= */

function refresh(){

    createLessons();

    updateProgress();
}

refresh();


/* =========================================
   اگر از یک تب دیگر برگشت
========================================= */

window.addEventListener("storage",function(){

    refresh();

});


/* =========================================
   وقتی صفحه دوباره فعال شد
========================================= */

document.addEventListener("visibilitychange",function(){

    if(!document.hidden){

        refresh();

    }

});

</script>

</body>
</html>
