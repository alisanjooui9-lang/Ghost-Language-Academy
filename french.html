<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>French — Ghost Language Academy</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at top,#172033 0%,#080b12 45%,#030509 100%);
    color:#fff;
    min-height:100vh;
}

header{
    padding:25px 15px;
    text-align:center;
    border-bottom:1px solid #263247;
    background:rgba(5,8,14,.88);
    position:sticky;
    top:0;
    z-index:20;
    backdrop-filter:blur(12px);
}

.logo{
    font-size:28px;
    font-weight:bold;
    letter-spacing:2px;
}

.logo span{
    color:#00d9ff;
}

.subtitle{
    color:#9daabd;
    margin-top:8px;
}

.container{
    width:min(1100px,94%);
    margin:25px auto 60px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:25px;
}

.stat{
    background:rgba(15,22,35,.9);
    border:1px solid #27364e;
    border-radius:16px;
    padding:17px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:24px;
    color:#00d9ff;
    margin-top:7px;
}

.progress-box{
    background:#0c111b;
    border:1px solid #27364e;
    padding:15px;
    border-radius:15px;
    margin-bottom:25px;
}

.progress{
    height:12px;
    background:#182131;
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00d9ff,#7c4dff);
    transition:.4s;
}

.lessons{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.lesson-card{
    background:linear-gradient(145deg,#101827,#080d15);
    border:1px solid #26364d;
    border-radius:18px;
    padding:20px;
    transition:.25s;
}

.lesson-card:hover{
    transform:translateY(-4px);
    border-color:#00d9ff;
}

.lesson-card.locked{
    opacity:.45;
    filter:grayscale(.7);
}

.lesson-number{
    color:#00d9ff;
    font-size:14px;
    margin-bottom:8px;
}

.lesson-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}

button{
    border:none;
    cursor:pointer;
    border-radius:12px;
    padding:12px 16px;
    color:#fff;
    background:linear-gradient(135deg,#007c99,#5940a8);
    font-weight:bold;
    width:100%;
}

button:hover{
    filter:brightness(1.15);
}

button:disabled{
    cursor:not-allowed;
    opacity:.5;
}

#course{
    display:none;
}

.lesson-box{
    background:rgba(10,15,24,.97);
    border:1px solid #293a54;
    border-radius:20px;
    padding:25px;
}

.back{
    width:auto;
    margin-bottom:20px;
    background:#172235;
}

.lesson-header{
    border-bottom:1px solid #26364d;
    padding-bottom:20px;
    margin-bottom:22px;
}

.lesson-header h2{
    color:#00d9ff;
    margin-bottom:10px;
}

.section{
    margin:22px 0;
}

.section h3{
    color:#8f7cff;
    margin-bottom:12px;
}

.explanation{
    line-height:2;
    color:#d9e0eb;
}

.words{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:10px;
}

.word{
    background:#111a29;
    border:1px solid #26364d;
    border-radius:12px;
    padding:12px;
}

.word strong{
    display:block;
    color:#00d9ff;
    direction:ltr;
    text-align:left;
    margin-bottom:5px;
}

.examples{
    display:grid;
    gap:10px;
}

.example{
    background:#0e1724;
    border-right:3px solid #00d9ff;
    padding:13px;
    border-radius:8px;
    line-height:1.9;
}

.fr{
    direction:ltr;
    text-align:left;
    color:#fff;
    font-weight:bold;
}

.tip{
    background:rgba(124,77,255,.1);
    border:1px solid #513f91;
    padding:15px;
    border-radius:12px;
    line-height:2;
}

.quiz{
    background:#0d1522;
    border:1px solid #2b3d59;
    border-radius:15px;
    padding:18px;
}

.question{
    font-size:18px;
    margin-bottom:15px;
}

.options{
    display:grid;
    gap:9px;
}

.option{
    background:#172234;
    border:1px solid #2c3d58;
    text-align:right;
}

.option:hover{
    border-color:#00d9ff;
}

.option.correct{
    background:#123d35;
    border-color:#20d39b;
}

.option.wrong{
    background:#411c25;
    border-color:#ff5364;
}

.result{
    margin-top:15px;
    min-height:25px;
    font-weight:bold;
}

.complete-btn{
    margin-top:18px;
}

.exam{
    background:linear-gradient(145deg,#16102a,#090d18);
    border:1px solid #5948a1;
}

.exam-question{
    margin:20px 0;
    padding:18px;
    background:#0d1522;
    border-radius:14px;
    border:1px solid #293b58;
}

.exam-question p{
    margin-bottom:12px;
    line-height:1.8;
}

.exam-option{
    margin:6px 0;
    background:#182337;
    text-align:right;
}

.certificate{
    display:none;
    background:#fff;
    color:#111;
    border:12px double #111;
    padding:35px;
    margin-top:25px;
    text-align:center;
    position:relative;
}

.certificate h1{
    font-size:34px;
    margin-bottom:10px;
}

.certificate h2{
    color:#222;
    margin:15px 0;
}

.certificate .name{
    font-size:28px;
    font-weight:bold;
    margin:20px;
}

.cert-info{
    line-height:2;
}

.signature{
    margin-top:35px;
    display:inline-block;
    min-width:220px;
}

.signature-line{
    border-top:2px solid #111;
    margin-top:35px;
    padding-top:7px;
}

.seal{
    margin:25px auto 0;
    width:115px;
    height:115px;
    border:5px double #111;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:bold;
    text-align:center;
}

.print-btn{
    background:#222;
    margin-top:20px;
}

.hidden{
    display:none!important;
}

@media(max-width:650px){
    .stats{
        grid-template-columns:1fr;
    }

    .lesson-box{
        padding:17px;
    }

    .certificate{
        padding:20px;
    }
}

@media print{
    body{
        background:#fff;
    }

    header,
    .stats,
    .progress-box,
    #lessonList,
    .back,
    #course,
    .print-btn{
        display:none!important;
    }

    .certificate{
        display:block!important;
        margin:0;
        min-height:90vh;
    }
}
</style>
</head>

let currentLesson=0;

function completed(n){
    return localStorage.getItem("frenchLesson"+n+"Completed")==="true";
}

function getXP(){
    return Number(localStorage.getItem("frenchXP")||0);
}

function updateStats(){
    let count=0;

    for(let i=1;i<=50;i++){
        if(completed(i)) count++;
    }

    document.getElementById("completedCount").textContent=count+" / 50";
    document.getElementById("xp").textContent=getXP();

    let percent=(count/50)*100;
    document.getElementById("progressBar").style.width=percent+"%";

    if(localStorage.getItem("frenchExamPassed")==="true"){
        document.getElementById("status").textContent="دوره تکمیل شد 🏆";
    }else{
        document.getElementById("status").textContent="در حال یادگیری";
    }
}

function addXP(amount,key){
    if(localStorage.getItem(key)==="true") return;

    localStorage.setItem(key,"true");

    let xp=getXP()+amount;
    localStorage.setItem("frenchXP",xp);

    updateStats();
}

function renderLessons(){

    const list=document.getElementById("lessonList");
    list.innerHTML="";

    lessons.forEach((lesson,index)=>{

        const number=index+1;
        const unlocked=
            number===1 ||
            completed(number-1);

        const card=document.createElement("div");
        card.className="lesson-card"+(unlocked?"":" locked");

        let buttonText;

        if(completed(number)){
            buttonText="✓ تکمیل شده";
        }else if(unlocked){
            buttonText=number===50?"🏆 شروع آزمون نهایی":"شروع درس";
        }else{
            buttonText="🔒 قفل";
        }

        card.innerHTML=`
            <div class="lesson-number">LESSON ${number}</div>
            <div class="lesson-title">${lesson.title}</div>
            <button ${unlocked?"":"disabled"} onclick="openLesson(${index})">
                ${buttonText}
            </button>
        `;

        list.appendChild(card);
    });

    updateStats();
}

function openLesson(index){

    currentLesson=index;

    document.getElementById("dashboard").style.display="none";
    document.getElementById("course").style.display="block";

    if(index===49){
        renderFinalExam();
    }else{
        renderLesson(index);
    }

    window.scrollTo({top:0,behavior:"smooth"});
}

function renderLesson(index){

    const lesson=lessons[index];
    const already=completed(index+1);

    let words=lesson.words.map(w=>`
        <div class="word">
            <strong>${w[0]}</strong>
            <span>${w[1]}</span>
        </div>
    `).join("");

    let examples=lesson.examples.map(e=>`
        <div class="example">
            <div class="fr">${e[0]}</div>
            <div>${e[1]}</div>
        </div>
    `).join("");

    let options=lesson.options.map((o,i)=>`
        <button class="option" onclick="answerLesson(${i},${lesson.answer},this)">
            ${o}
        </button>
    `).join("");

    document.getElementById("lessonContent").innerHTML=`

        <div class="lesson-header">
            <h2>درس ${index+1}: ${lesson.title}</h2>
            <p>🇫🇷 Français</p>
        </div>

        <div class="section">
            <h3>📖 توضیح درس</h3>
            <p class="explanation">${lesson.explanation}</p>
        </div>

        <div class="section">
            <h3>🧠 واژگان</h3>
            <div class="words">${words}</div>
        </div>

        <div class="section">
            <h3>💬 مثال‌ها</h3>
            <div class="examples">${examples}</div>
        </div>

        <div class="section">
            <h3>💡 نکته آموزشی</h3>
            <div class="tip">${lesson.tip}</div>
        </div>

        <div class="section quiz">
            <h3>📝 تمرین</h3>
            <div class="question">${lesson.question}</div>

            <div class="options">
                ${options}
            </div>

            <div class="result" id="lessonResult"></div>

            <button
                class="complete-btn"
                id="completeBtn"
                disabled
                onclick="completeLesson(${index+1})">
                ${already?"✓ درس تکمیل شده":"تکمیل درس و دریافت XP"}
            </button>
        </div>
    `;
}

function answerLesson(selected,correct,button){

    const buttons=document.querySelectorAll(".option");

    buttons.forEach(b=>b.disabled=true);

    const result=document.getElementById("lessonResult");

    if(selected===correct){

        button.classList.add("correct");

        result.textContent="✅ پاسخ درست است!";

        document.getElementById("completeBtn").disabled=false;

    }else{

        button.classList.add("wrong");

        result.textContent="❌ پاسخ اشتباه است. گزینه درست را دوباره انتخاب کنید.";

        setTimeout(()=>{
            buttons.forEach(b=>b.disabled=false);
            button.classList.remove("wrong");
        },700);
    }
}

function completeLesson(number){

    if(completed(number)){
        backToLessons();
        return;
    }

    localStorage.setItem("frenchLesson"+number+"Completed","true");

    addXP(20,"frenchLesson"+number+"XP");

    alert("🎉 درس "+number+" تکمیل شد! +20 XP");

    backToLessons();
}

function renderFinalExam(){

    let html=`
        <div class="lesson-header">
            <h2>🏆 آزمون نهایی زبان فرانسوی</h2>
            <p>برای دریافت گواهی باید حداقل ۷۰٪ پاسخ‌ها درست باشند.</p>
        </div>

        <div class="exam">
    `;

    examQuestions.forEach((item,index)=>{

        html+=`
            <div class="exam-question">
                <p><b>${index+1}. ${item.q}</b></p>
        `;

        item.o.forEach((option,i)=>{
            html+=`
                <button
                    class="exam-option"
                    data-question="${index}"
                    data-answer="${i}"
                    onclick="selectExamAnswer(${index},${i},this)">
                    ${option}
                </button>
            `;
        });

        html+=`</div>`;
    });

    html+=`
            <div id="examResult" class="result"></div>

            <button onclick="submitExam()">
                🎓 ثبت آزمون و بررسی نتیجه
            </button>
        </div>

        <div id="certificate" class="certificate"></div>
    `;

    document.getElementById("lessonContent").innerHTML=html;
}

const examAnswers={};

function selectExamAnswer(q,a,button){

    examAnswers[q]=a;

    document
        .querySelectorAll('[data-question="'+q+'"]')
        .forEach(b=>b.classList.remove("correct","wrong"));

    button.classList.add("correct");
}

function submitExam(){

    let score=0;

    examQuestions.forEach((q,index)=>{
        if(examAnswers[index]===q.a){
            score++;
        }
    });

    const percent=Math.round((score/examQuestions.length)*100);

    const result=document.getElementById("examResult");

    if(percent>=70){

        result.textContent=
            "🎉 تبریک! شما با نمره "+percent+"٪ آزمون نهایی را با موفقیت گذراندید.";

        localStorage.setItem("frenchExamPassed","true");
        localStorage.setItem("frenchExamScore",percent);

        addXP(50,"frenchExamXPAdded");

        localStorage.setItem("frenchLesson50Completed","true");

        updateStats();

        showCertificate(percent);

    }else{

        result.textContent=
            "❌ نمره شما "+percent+"٪ است. برای قبولی حداقل ۷۰٪ لازم است. دوباره مرور کنید و تلاش کنید.";
    }
}

function showCertificate(score){

    const cert=document.getElementById("certificate");

    const date=new Date().toLocaleDateString("fa-IR");

    let id=localStorage.getItem("frenchCertificateID");

    if(!id){

        id="GLA-FRA-"+Math.floor(100000+Math.random()*900000);

        localStorage.setItem("frenchCertificateID",id);
    }

    cert.innerHTML=`
        <h1>GHOST LANGUAGE ACADEMY</h1>

        <h2>گواهی پایان دوره</h2>

        <p>بدین‌وسیله تأیید می‌شود که</p>

        <div class="name">کاربر نمونه</div>

        <p>
            دوره جامع زبان فرانسوی
            <br>
            <b>Français — French Language Course</b>
        </p>

        <p class="cert-info">
            را با موفقیت به پایان رسانده است.
            <br>
            نمره آزمون نهایی: <b>${score}%</b>
            <br>
            تاریخ صدور: <b>${date}</b>
            <br>
            شناسه گواهی: <b>${id}</b>
        </p>
