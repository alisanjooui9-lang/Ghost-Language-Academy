<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Language Academy | English</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at top right,#151a45 0%,#080b18 38%,#05060d 100%);
    color:#fff;
    min-height:100vh;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    padding:18px 20px;
    background:rgba(5,7,18,.88);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(83,105,255,.25);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:20px;
    font-weight:bold;
    color:#7d8cff;
    text-shadow:0 0 15px rgba(100,120,255,.6);
}

.back{
    text-decoration:none;
    color:#fff;
    background:linear-gradient(135deg,#3445ff,#8b3dff);
    padding:10px 16px;
    border-radius:12px;
    font-size:13px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 18px 60px;
}

.hero{
    text-align:center;
    padding:25px 10px 30px;
}

.hero h1{
    font-size:34px;
    margin-bottom:12px;
    background:linear-gradient(90deg,#7185ff,#c16cff);
    -webkit-background-clip:text;
    color:transparent;
}

.hero p{
    color:#aeb5d4;
    line-height:1.9;
}

.progressBox{
    margin:20px 0 30px;
    padding:20px;
    border-radius:20px;
    background:rgba(18,22,48,.75);
    border:1px solid rgba(110,125,255,.22);
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.progressInfo{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    color:#dce0ff;
    margin-bottom:12px;
    font-size:14px;
}

.progress{
    height:12px;
    background:#171b32;
    border-radius:20px;
    overflow:hidden;
}

.progressBar{
    height:100%;
    width:0%;
    border-radius:20px;
    background:linear-gradient(90deg,#4355ff,#a349ff);
    box-shadow:0 0 18px rgba(112,85,255,.6);
    transition:.4s;
}

.lessons{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:16px;
}

.lesson{
    position:relative;
    padding:22px;
    min-height:150px;
    border-radius:20px;
    background:linear-gradient(145deg,rgba(20,25,55,.95),rgba(11,14,31,.95));
    border:1px solid rgba(100,115,255,.18);
    transition:.25s;
    cursor:pointer;
    overflow:hidden;
}

.lesson:hover:not(.locked){
    transform:translateY(-5px);
    border-color:rgba(126,139,255,.65);
    box-shadow:0 12px 35px rgba(63,75,255,.18);
}

.lesson::before{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    right:-40px;
    top:-40px;
    background:rgba(84,91,255,.12);
    border-radius:50%;
}

.number{
    font-size:13px;
    color:#8592ff;
    margin-bottom:12px;
}

.lesson h3{
    font-size:17px;
    margin-bottom:9px;
}

.lesson p{
    color:#949bbd;
    font-size:13px;
    line-height:1.7;
}

.status{
    margin-top:15px;
    display:inline-block;
    padding:6px 10px;
    border-radius:9px;
    font-size:11px;
    background:rgba(64,72,120,.25);
    color:#c4c9e8;
}

.completed{
    border-color:rgba(60,220,150,.4);
}

.completed .status{
    color:#5df0b0;
    background:rgba(40,210,130,.1);
}

.locked{
    opacity:.48;
    cursor:not-allowed;
}

.locked .status{
    color:#ff9d9d;
}

.lessonView{
    display:none;
}

.lessonContent{
    max-width:850px;
    margin:auto;
    background:rgba(12,16,36,.92);
    border:1px solid rgba(105,120,255,.25);
    border-radius:24px;
    padding:25px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.lessonTop{
    text-align:center;
    margin-bottom:25px;
}

.lessonTop .badge{
    display:inline-block;
    background:rgba(85,95,255,.15);
    color:#9da7ff;
    padding:7px 12px;
    border-radius:10px;
    font-size:12px;
    margin-bottom:12px;
}

.lessonTop h2{
    font-size:28px;
    margin-bottom:10px;
}

.lessonTop p{
    color:#a8aecb;
}

.section{
    margin-top:22px;
    padding:18px;
    background:rgba(23,28,57,.65);
    border-radius:17px;
    border:1px solid rgba(120,130,255,.12);
}

.section h3{
    color:#9ba6ff;
    margin-bottom:13px;
}

.word{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px;
    margin:8px 0;
    border-radius:11px;
    background:rgba(5,8,20,.6);
}

.word b{
    color:#fff;
}

.word span{
    color:#9fa7c8;
}

.example{
    margin-top:10px;
    padding:13px;
    border-right:3px solid #6877ff;
    background:rgba(80,90,255,.06);
    line-height:1.9;
    color:#d8dcf5;
}

.quiz{
    margin-top:12px;
}

.quiz label{
    display:block;
    margin:8px 0;
    padding:11px;
    border-radius:10px;
    background:#0a0e20;
    cursor:pointer;
}

.quiz label:hover{
    background:#111632;
}

input[type="text"]{
    width:100%;
    padding:13px;
    margin-top:8px;
    background:#080b18;
    color:#fff;
    border:1px solid #303862;
    border-radius:11px;
    outline:none;
}

.completeArea{
    text-align:center;
    margin-top:25px;
}

.completeBtn,.backBtn{
    border:0;
    cursor:pointer;
    padding:13px 20px;
    border-radius:12px;
    color:#fff;
    font-weight:bold;
    margin:5px;
}

.completeBtn{
    background:linear-gradient(135deg,#4054ff,#9b43ff);
    box-shadow:0 8px 25px rgba(80,70,255,.25);
}

.backBtn{
    background:#202641;
}

.message{
    margin-top:12px;
    color:#6ff0b2;
    min-height:24px;
}

@media(max-width:600px){
    .hero h1{
        font-size:27px;
    }

    .lessonContent{
        padding:17px;
    }

    .lessonTop h2{
        font-size:23px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">👻 Ghost Language Academy</div>
    <a href="index.html" class="back">بازگشت</a>
</header>

<main class="container">

<section id="lessonList">

    <div class="hero">
        <h1>🇬🇧 English Academy</h1>
        <p>۵۰ درس انگلیسی از سطح پایه تا پیشرفته</p>
    </div>

    <div class="progressBox">
        <div class="progressInfo">
            <span id="progressText">پیشرفت: 0 از 50 درس</span>
            <span id="xpText">XP: 0</span>
        </div>

        <div class="progress">
            <div class="progressBar" id="progressBar"></div>
        </div>
    </div>

    <div class="lessons" id="lessons"></div>

</section>

<section class="lessonView" id="lessonView">

    <div class="lessonContent">

        <div class="lessonTop">
            <div class="badge" id="lessonNumber"></div>
            <h2 id="lessonTitle"></h2>
            <p id="lessonDescription"></p>
        </div>

        <div id="lessonBody"></div>

        <div class="completeArea">
            <button class="completeBtn" onclick="completeLesson()">
                ✅ تکمیل درس
            </button>

            <button class="backBtn" onclick="showList()">
                ↩ بازگشت به درس‌ها
            </button>

            <div class="message" id="message"></div>
        </div>

    </div>

</section>

</main>

/* =========================
   STORAGE
========================= */

function completedKey(n){
    return "englishLesson" + n + "Completed";
}

function isCompleted(n){
    return localStorage.getItem(completedKey(n)) === "true";
}

function isUnlocked(n){
    if(n === 1) return true;
    return isCompleted(n - 1);
}

function getCompletedCount(){
    let count = 0;

    for(let i=1;i<=50;i++){
        if(isCompleted(i)) count++;
    }

    return count;
}

function getXP(){
    return Number(localStorage.getItem("englishXP") || 0);
}


/* =========================
   RENDER LESSONS
========================= */

function renderLessons(){

    const box = document.getElementById("lessons");

    box.innerHTML = "";

    lessons.forEach((lesson,index)=>{

        const n = index + 1;
        const completed = isCompleted(n);
        const unlocked = isUnlocked(n);

        const card = document.createElement("div");

        card.className =
            "lesson " +
            (completed ? "completed " : "") +
            (!unlocked ? "locked" : "");

        card.innerHTML = `
            <div class="number">درس ${n}</div>
            <h3>${lesson.title}</h3>
            <p>${lesson.desc}</p>

            <div class="status">
                ${
                    completed
                    ? "✅ تکمیل شده"
                    : unlocked
                    ? "▶ شروع درس"
                    : "🔒 قفل"
                }
            </div>
        `;

        if(unlocked){
            card.onclick = () => openLesson(n);
        }

        box.appendChild(card);
    });

    updateProgress();
}


/* =========================
   PROGRESS
========================= */

function updateProgress(){

    const completed = getCompletedCount();
    const percent = Math.round((completed / 50) * 100);

    document.getElementById("progressText").textContent =
        `پیشرفت: ${completed} از 50 درس`;

    document.getElementById("xpText").textContent =
        `XP: ${getXP()}`;

    document.getElementById("progressBar").style.width =
        percent + "%";
}


/* =========================
   OPEN LESSON
========================= */

let currentLesson = 0;

function openLesson(n){

    if(!isUnlocked(n)) return;

    currentLesson = n;

    const lesson = lessons[n - 1];

    document.getElementById("lessonList").style.display = "none";
    document.getElementById("lessonView").style.display = "block";

    document.getElementById("lessonNumber").textContent =
        "LESSON " + n;

    document.getElementById("lessonTitle").textContent =
        lesson.title;

    document.getElementById("lessonDescription").textContent =
        lesson.desc;

    let html = "";

    html += `
        <div class="section">
            <h3>📚 واژگان مهم</h3>
    `;

    lesson.words.forEach(word=>{

        html += `
            <div class="word">
                <b>${word[0]}</b>
                <span>${word[1]}</span>
            </div>
        `;

    });

    html += `</div>`;

    html += `
        <div class="section">
            <h3>💬 مثال‌ها</h3>
    `;

    lesson.examples.forEach(example=>{

        html += `
            <div class="example">
                ${example}
            </div>
        `;

    });

    html += `</div>`;

    html += `
        <div class="section">
            <h3>🧠 تمرین</h3>

            <div class="quiz">
                <p>${lesson.question}</p>
    `;

    lesson.options.forEach((option,i)=>{

        html += `
            <label>
                <input type="radio" name="quiz" value="${i}">
                ${option}
            </label>
        `;

    });

    html += `
            </div>
        </div>
    `;

    html += `
        <div class="section">
            <h3>✍️ تمرین نوشتاری</h3>
            <p style="color:#aeb5d4;line-height:1.8;">
                یک جمله انگلیسی درباره موضوع این درس بنویس:
            </p>

            <input
                type="text"
                id="typingAnswer"
                placeholder="جمله انگلیسی خود را اینجا بنویس..."
            >
        </div>
    `;

    document.getElementById("lessonBody").innerHTML = html;

    document.getElementById("message").textContent =
        isCompleted(n)
        ? "✅ این درس قبلاً تکمیل شده است."
        : "";
}


/* =========================
   COMPLETE
========================= */

function completeLesson(){

    if(!currentLesson) return;

    const lesson = lessons[currentLesson - 1];

    const selected =
        document.querySelector('input[name="quiz"]:checked');

    if(!selected){

        document.getElementById("message").textContent =
            "⚠️ ابتدا به سؤال تمرینی پاسخ بده.";

        return;
    }

    const answer = Number(selected.value);

    if(answer !== lesson.answer){

        document.getElementById("message").textContent =
            "❌ پاسخ درست نیست. دوباره امتحان کن.";

        return;
    }

    const key = completedKey(currentLesson);

    const alreadyCompleted =
        localStorage.getItem(key) === "true";

    if(!alreadyCompleted){

        localStorage.setItem(key,"true");

        let xp = getXP();

        xp += 20;

        localStorage.setItem("englishXP",xp);
    }

    document.getElementById("message").textContent =
        `🎉 درس ${currentLesson} با موفقیت تکمیل شد! +20 XP`;

    setTimeout(()=>{

        showList();

        renderLessons();

    },1200);
}


/* =========================
   BACK
========================= */

function showList(){

    document.getElementById("lessonView").style.display = "none";
    document.getElementById("lessonList").style.display = "block";

    currentLesson = 0;

    renderLessons();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================
   START
========================= */

renderLessons();

</script>
